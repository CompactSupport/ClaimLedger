name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Dev extra only. No OpenAI package and no API key.
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m evidenceforge verify --doc examples/aurora.md --claims examples/claims.json --out output/report.json --markdown output/report.md
      - run: python -m evidenceforge evaluate --dataset examples/eval.jsonl --out output/eval.json
