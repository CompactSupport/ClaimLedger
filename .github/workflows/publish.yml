# Prepared for PyPI Trusted Publishing. Do not run this workflow until the
# maintainer has approved a release and configured the PyPI project.
# There is no stored API token. Authentication is GitHub OIDC.
name: Publish to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
