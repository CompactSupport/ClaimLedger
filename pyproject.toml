[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceforge-mvp"
version = "0.1.0"
description = "Local-first, traceable claim verification over your own documents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "EvidenceForge contributors"}]
keywords = ["evaluation", "claims", "citations", "llm", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pypdf>=5,<7"]

[project.optional-dependencies]
openai = ["openai>=1.70,<4"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
evidenceforge = "evidenceforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff 0.14+ enables a much larger default set. Keep CI on the stable core rules.
select = ["E4", "E7", "E9", "F"]
